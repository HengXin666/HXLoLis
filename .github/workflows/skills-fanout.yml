name: Skills Fanout
on:
  pull_request:
    paths: [".agents/skills/**"]
  push:
    branches: ["main"]
    paths: [".agents/skills/**"]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只列出将要改动的仓库, 不推送"
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  version:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - name: Skill version must be bumped
        run: uv run scripts/skills/sync.py version-check --base "origin/${{ github.base_ref }}" --report skills-version-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skills-version-report
          path: skills-version-report.json
          if-no-files-found: ignore
          retention-days: 7
  fanout:
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - name: Open sync PRs in consumer repos
        env:
          HX_SKILLS_TOKEN: ${{ secrets.HX_SKILLS_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          if [ -z "$HX_SKILLS_TOKEN" ]; then
            echo "::warning::未配置 HX_SKILLS_TOKEN, 跳过扇出"
            exit 0
          fi
          flags=()
          [ "$DRY_RUN" = "true" ] && flags+=(--dry-run)
          uv run scripts/skills/fanout.py "${flags[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skills-fanout-report
          path: skills-fanout-report.json
          if-no-files-found: ignore
          retention-days: 7
