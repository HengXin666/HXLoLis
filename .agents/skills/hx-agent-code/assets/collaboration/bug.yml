name: Bug report
description: Report reproducible unexpected behavior
body:
    - type: textarea
      id: reproduce
      attributes:
          label: Reproduction steps and minimal input
      validations:
          required: true
    - type: textarea
      id: expected
      attributes:
          label: Expected behavior
      validations:
          required: true
    - type: textarea
      id: actual
      attributes:
          label: Actual behavior and logs with secrets removed
      validations:
          required: true
    - type: input
      id: environment
      attributes:
          label: Version, operating system and runtime
      validations:
          required: true
